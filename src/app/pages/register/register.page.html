<ion-content [fullscreen]="true">

  <div class="login-background">

    <!-- Decorative background shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>


    <!-- Main Card -->
    <div class="login-card">

      <!-- ================================
           LOGO
      ================================= -->

      <div class="logo-container">

        <div class="logo-icon">

          <ion-icon
            name="document-text-outline">
          </ion-icon>

          <ion-icon
            class="lock-icon"
            name="lock-closed-outline">
          </ion-icon>

        </div>

      </div>


      <!-- ================================
           APP TITLE
      ================================= -->

      <h1 class="app-title">
        Document Vault
      </h1>

      <p class="app-subtitle">
        Your Documents&nbsp; • &nbsp;Your Security
      </p>


      <!-- ================================
           CREATE ACCOUNT TITLE
      ================================= -->

      <div class="welcome-section">

        <h2>
          Create Account
        </h2>

        <p>
          Create your Document Vault account
        </p>

      </div>


      <!-- ================================
           REGISTER FORM
      ================================= -->

      <div class="register-form">


        <!-- Full Name -->
        <div class="input-container">

          <div class="input-icon">

            <ion-icon
              name="person-outline">
            </ion-icon>

          </div>

          <ion-input
            type="text"
            placeholder="Full Name">
          </ion-input>

        </div>


        <!-- Email -->
        <div class="input-container">

          <div class="input-icon">

            <ion-icon
              name="mail-outline">
            </ion-icon>

          </div>

          <ion-input
            type="email"
            placeholder="Email">
          </ion-input>

        </div>


        <!-- Mobile Number -->
        <div class="input-container">

          <div class="input-icon">

            <ion-icon
              name="phone-portrait-outline">
            </ion-icon>

          </div>

          <ion-input
            type="tel"
            placeholder="Mobile Number">
          </ion-input>

        </div>


        <!-- Password -->
        <div class="input-container">

          <div class="input-icon">

            <ion-icon
              name="lock-closed-outline">
            </ion-icon>

          </div>

          <ion-input
            type="password"
            placeholder="Password">
          </ion-input>

          <ion-button
            fill="clear"
            class="password-toggle">

            <ion-icon
              slot="icon-only"
              name="eye-outline">
            </ion-icon>

          </ion-button>

        </div>


        <!-- Confirm Password -->
        <div class="input-container">

          <div class="input-icon">

            <ion-icon
              name="shield-checkmark-outline">
            </ion-icon>

          </div>

          <ion-input
            type="password"
            placeholder="Confirm Password">
          </ion-input>

          <ion-button
            fill="clear"
            class="password-toggle">

            <ion-icon
              slot="icon-only"
              name="eye-outline">
            </ion-icon>

          </ion-button>

        </div>


        <!-- ================================
             CREATE ACCOUNT BUTTON
        ================================= -->

        <ion-button
          expand="block"
          class="login-button"
          routerLink="/login">

          <ion-icon
            slot="start"
            name="person-add-outline">
          </ion-icon>

          CREATE ACCOUNT

        </ion-button>


        <!-- ================================
             LOGIN LINK
        ================================= -->

        <div class="register-section">

          <span>
            ALREADY HAVE AN ACCOUNT?
          </span>

          <button
            type="button"
            class="login-link"
            routerLink="/login">

            LOGIN

          </button>

        </div>


      </div>

    </div>

  </div>

</ion-content>
