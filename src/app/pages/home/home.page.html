<ion-content [fullscreen]="true" class="home-content">

  <div class="home-container">

    <!-- Decorative background circles -->
    <div class="circle circle-top"></div>
    <div class="circle circle-bottom"></div>
    <div class="circle circle-right"></div>

    <!-- Header -->
    <div class="header-section">

      <div class="app-logo">
        <div class="logo-icon">
          <ion-icon name="document-lock-outline"></ion-icon>
        </div>
      </div>

      <h1>Document Vault</h1>

      <p class="tagline">
        Your Documents <span>•</span> Your Security
      </p>

    </div>


    <!-- Welcome -->
    <div class="welcome-section">

      <h2>Welcome 👋</h2>

      <p>
        Manage your important<br />
        documents securely.
      </p>

    </div>


    <!-- Options -->
    <div class="options-section">

      <!-- Store Documents -->
      <div
        class="action-card"
        (click)="openStoreDocuments()"
      >

        <div class="action-icon store-icon">
          <ion-icon name="cloud-upload-outline"></ion-icon>
        </div>

        <div class="action-content">
          <h3>Store Documents</h3>

          <p>
            Upload and organize your documents.
          </p>
        </div>

        <ion-icon
          class="arrow-icon"
          name="chevron-forward-outline">
        </ion-icon>

      </div>


      <!-- See Documents -->
      <div
        class="action-card"
        (click)="openDocuments()"
      >

        <div class="action-icon folder-icon">
          <ion-icon name="folder-open-outline"></ion-icon>
        </div>

        <div class="action-content">
          <h3>See Documents</h3>

          <p>
            View your documents category wise.
          </p>
        </div>

        <ion-icon
          class="arrow-icon"
          name="chevron-forward-outline">
        </ion-icon>

      </div>

    </div>


    <!-- Bottom -->
    <div class="bottom-section">
      <p>Keep your documents safe and secure 🔐</p>
    </div>

  </div>

</ion-content>
